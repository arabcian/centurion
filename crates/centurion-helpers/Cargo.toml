[package]
name = "centurion-helpers"
version.workspace = true
edition = "2021"
rust-version = "1.74"
description = "Centurion privileged root helpers (pkexec targets)"
license = "GPL-3.0-or-later"

[dependencies]
serde_json = "1"
libc = "0.2"
centurion-spectrum = { path = "../centurion-spectrum" }


# One source, two polkit-pinned binaries (role fixed at compile time via CARGO_BIN_NAME):
#   tune-helper          everything (raw values, boot preset, preset store, driver options)
#   tune-profile-helper  only ops that cannot set a value the user has not approved (see PROFILE_OPS)
[[bin]]
name = "tune-helper"
path = "src/bin/tune-helper.rs"

[[bin]]
name = "tune-profile-helper"
path = "src/bin/tune-profile-helper.rs"

#   tune-admin-helper    only the unlock PIN (password every time)
[[bin]]
name = "tune-admin-helper"
path = "src/bin/tune-admin-helper.rs"

# Same pattern for the system tools (see src/bin/sysadmin-helper.rs):
#   sysadmin-helper         runtime actions (password, then polkit's keep window)
#   sysadmin-config-helper  configuration files, modules, driver options (password every time)
[[bin]]
name = "sysadmin-helper"
path = "src/bin/sysadmin-helper.rs"

[[bin]]
name = "sysadmin-config-helper"
path = "src/bin/sysadmin-config-helper.rs"

[dev-dependencies]
# Property-based tests only (`cargo test`); nothing in a normal build links it.
proptest = { version = "1", default-features = false, features = ["std"] }
