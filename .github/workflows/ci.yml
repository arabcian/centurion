name: CI
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 tests/nvcurve_safety_static_test.py

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  gui:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      ASAN_OPTIONS: detect_leaks=0  # Qt keeps process-lifetime allocations
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
             qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-l10n-tools libgl-dev libxkbcommon-dev dbus
      - run: cmake -S gui -B build -DCMAKE_BUILD_TYPE=Debug -DCENTURION_BUILD_TESTS=ON
             -DCENTURION_SANITIZE=ON -DCENTURION_LTO=OFF
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: python3 gui/tests/translation_tr_test.py
      - run: python3 gui/tests/chartaxis_native_test.py
      - run: python3 gui/tests/integerunits_native_test.py
      - run: python3 gui/tests/workspacefields_native_test.py
      - run: python3 gui/tests/calibrationmath_native_test.py
      - run: python3 gui/tests/abverify_native_test.py
      - run: python3 gui/tests/report_features_native_test.py
      - run: python3 gui/tests/operationreceipt_native_test.py
      - run: python3 gui/tests/operationlease_native_test.py
      - run: python3 gui/tests/simulationguard_native_test.py
      - run: python3 gui/tests/real_shell_fixture_test.py
      - run: python3 gui/tests/tur36_lifecycle_static_test.py
      - run: python3 gui/tests/telemetrybroker_native_test.py
      - run: python3 gui/tests/curveplan_incarnation_native_test.py
      - run: python3 gui/tests/tur41_optimization_static_test.py
      - run: python3 gui/tests/tuningcomparison_native_test.py
      - run: python3 gui/tests/cohistory_sceneplan_native_test.py
      - run: python3 gui/tests/tur29_contract_static_test.py
      - run: python3 gui/tests/tur30_history_native_test.py
      - run: python3 gui/tests/tur31_diagnostic_native_test.py
      - run: python3 gui/tests/tur32_presentation_native_test.py
      - run: python3 gui/tests/bootreceiptcoverage_native_test.py
      - run: python3 gui/tests/powerprovenance_native_test.py
      - run: python3 gui/tests/tur35_network_boot_native_test.py
      - run: python3 gui/tests/tur30_sleep_hook_test.py
      - run: python3 gui/tests/scene_wifi_native_test.py
      - run: python3 gui/tests/wifichannel_native_test.py
      - run: python3 gui/tests/socketbind_native_test.py
      - run: python3 gui/tests/acpievidence_native_test.py
      - run: python3 gui/tests/scene_wifi_contract_static_test.py
      - run: python3 gui/tests/calibrationviewer_static_test.py
      - run: python3 gui/tests/topologyfields_native_test.py
      - run: python3 gui/tests/deviceidentity_native_test.py
      - run: python3 gui/tests/archiveidentity_native_test.py
      - run: python3 gui/tests/canvasviewport_native_test.py
      - run: python3 gui/tests/edidfields_native_test.py
      - run: python3 gui/tests/hardwarefields_native_test.py
      - run: python3 gui/tests/memoryfields_native_test.py
      - run: python3 gui/tests/structuredpci_native_test.py
      - run: python3 gui/tests/palettecontrast_native_test.py
      - run: python3 gui/tests/firewallpreview_native_test.py
      - run: python3 tests/test_firewall_preview_contract_static.py
      - name: Visual comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-visual-artifacts
          path: build/visual-artifacts
          if-no-files-found: ignore
