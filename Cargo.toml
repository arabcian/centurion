[workspace]
resolver = "2"
members = ["crates/centurion-helpers", "crates/centurion-spectrum", "crates/nvcurve", "crates/centurion-gpustress", "crates/centurion-cpustress"]

[workspace.package]
version = "2.0.0"  # single source: gui/CMakeLists.txt reads it too
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
